# nox configuration — the security/dependency gate that replaces dependabot.
# Schema reference: https://github.com/nox-hq/nox
#
# Only GENERATED or VENDORED artifacts are excluded here. First-party source
# (src/, test/, scripts/, ui/js/setup.js, ui/js/range-value.js, .github/) is
# scanned. Remaining first-party findings are reviewed one at a time and
# accepted in .nox-baseline.json, never by blinding whole directories. The
# path-alias imports once misread as slopsquatting are fixed upstream in nox
# 1.39.1, so they need no suppression at all.

# The baseline lives OUTSIDE .nox/, which is gitignored as a scan-artifact
# directory: a local `nox scan` writes a multi-megabyte .nox/baseline.json
# covering node_modules, and the reviewed suppressions this repo actually
# relies on must not share a path with it. Every entry in .nox-baseline.json
# is a finding someone read and classified, with the reason stored alongside.
policy:
  baseline_path: .nox-baseline.json

scan:
  exclude:
    # Rollup build output — the bundled, minified plugin.js re-trips the
    # secret / slopsquat heuristics with no signal; source is scanned instead.
    # Classification: Acceptable Pattern (generated). Last reviewed: 2026-07-11
    - com.felixgeelhaar.govee-light-management.sdPlugin/bin/
    # Vendored Elgato SDPI web-component library (third-party, not maintained
    # here). Minified bundle accounts for all 39 high secret false positives.
    # Classification: Acceptable Pattern (vendored). Last reviewed: 2026-07-11
    - com.felixgeelhaar.govee-light-management.sdPlugin/ui/js/sdpi-components.js
    # npm lockfile: integrity hashes look like API keys to the entropy detector;
    # dependency CVEs are surfaced via VULN-001 directly, not the lockfile text.
    # Classification: False Positive. Last reviewed: 2026-07-11
    - "**/package-lock.json"
    # nox's own baseline/cache — its finding fingerprints are SHA-256 hex that
    # re-trip the secret detector. Never scan the scanner's state.
    # Classification: Acceptable Pattern. Last reviewed: 2026-07-11
    - .nox/
    - findings.json
    - nox-results/
    # Markdown is prose. In a fresh CI environment the entropy/secret rules
    # (SEC-384/505/506/525/543/621/678/679) fire HIGH severity on ordinary
    # README lines ("any color (360°)", "per-segment RGB strip control") — 16
    # medium-confidence false positives, no real secrets. High-confidence real
    # secret patterns (actual API keys/tokens) are still caught in code.
    # Classification: False Positive (prose). Last reviewed: 2026-07-11
    # Literal + globs: "README.md" (all 16 FPs are here), "*.md" root, "**/*.md" nested.
    - README.md
    - "*.md"
    - "**/*.md"
