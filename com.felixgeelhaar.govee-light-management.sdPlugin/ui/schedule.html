<!doctype html>
<html>
  <head lang="en-gb">
    <meta charset="utf-8" />
    <title>Govee Light Management | Schedule</title>
    <link rel="stylesheet" href="./css/main.css" />
    <script src="./js/sdpi-components.js"></script>
    <script src="./js/setup.js"></script>
    <script src="./js/range-value.js"></script>
  </head>
  <body>
    <div id="settings" class="hidden">
      <sdpi-item label="Name">
        <sdpi-textfield
          setting="scheduleName"
          placeholder="e.g. Evening lights"
          maxlength="40"
        ></sdpi-textfield>
      </sdpi-item>

      <sdpi-item label="Device">
        <sdpi-select
          setting="selectedDeviceId"
          placeholder="Select a light or group"
          datasource="getDevices"
          show-refresh
          label-setting="selectedLightName"
        ></sdpi-select>
      </sdpi-item>

      <sdpi-item label="Repeat">
        <sdpi-select setting="scheduleType" default="daily">
          <option value="daily">Every day</option>
          <option value="weekly">On selected days</option>
          <option value="delay">Once, after a delay</option>
        </sdpi-select>
      </sdpi-item>

      <!-- Time, days and delay are written by the script below, so they carry
           no setting attribute: hour/minute/days must be saved together with
           the clock they were entered in. -->
      <sdpi-item label="Time" id="timeItem">
        <sdpi-calendar id="timeInput" type="time"></sdpi-calendar>
      </sdpi-item>

      <sdpi-item label="Days" id="daysItem" class="hidden">
        <sdpi-checkbox-list id="dayList" columns="4">
          <option value="1">Mon</option>
          <option value="2">Tue</option>
          <option value="3">Wed</option>
          <option value="4">Thu</option>
          <option value="5">Fri</option>
          <option value="6">Sat</option>
          <option value="0">Sun</option>
        </sdpi-checkbox-list>
      </sdpi-item>

      <sdpi-item label="Delay (sec)" id="delayItem" class="hidden">
        <sdpi-textfield
          id="delayInput"
          pattern="[0-9]+"
          placeholder="e.g. 300"
        ></sdpi-textfield>
      </sdpi-item>

      <sdpi-item label="Action">
        <sdpi-select setting="command" default="on">
          <option value="on">Turn On</option>
          <option value="off">Turn Off</option>
          <option value="toggle">Toggle</option>
          <option value="brightness">Set Brightness</option>
        </sdpi-select>
      </sdpi-item>

      <sdpi-item label="Brightness" id="scheduleBrightnessItem" class="hidden">
        <sdpi-range
          setting="commandValue"
          min="0"
          max="100"
          step="5"
          showlabels
          data-suffix="%"
          data-number-input
        >
          <span slot="min">Off</span>
          <span slot="max">Max</span>
        </sdpi-range>
      </sdpi-item>

      <sdpi-item>
        <p class="field-hint info" id="scheduleHint">
          Times use this computer's time zone. Press the key to pause or resume
          the schedule.
        </p>
      </sdpi-item>
    </div>

    <div id="setup" class="hidden">
      <sdpi-item label="API Key">
        <sdpi-password
          id="apiKey"
          global
          setting="unverifiedApiKey"
          placeholder="API key from Govee"
        ></sdpi-password>
      </sdpi-item>
      <sdpi-item>
        <sdpi-button id="connect">Connect</sdpi-button>
        <div id="errorMessage" class="hidden">
          Failed to connect, please try again.
        </div>
      </sdpi-item>
      <sdpi-item label="Guide" class="guide">
        <ol>
          <li>Open the Govee app</li>
          <li>Go to settings</li>
          <li>Select "Apply for API Key"</li>
          <li>Paste the key from Govee's email above</li>
        </ol>
        <a
          class="guide-link"
          href="https://developer.govee.com/reference/apply-you-govee-api-key"
          data-open-url
          >How to get a Govee API key</a
        >
      </sdpi-item>
    </div>

    <script src="./js/schedule-time.js"></script>
    <script>
      // GoveePI is defined by setup.js on DOMContentLoaded.
      document.addEventListener("DOMContentLoaded", function () {
        const timeItem = document.getElementById("timeItem");
        const daysItem = document.getElementById("daysItem");
        const delayItem = document.getElementById("delayItem");
        const brightnessItem = document.getElementById(
          "scheduleBrightnessItem",
        );
        const timeInput = document.getElementById("timeInput");
        const dayList = document.getElementById("dayList");
        const delayInput = document.getElementById("delayInput");
        const typeSelect = document.querySelector(
          'sdpi-select[setting="scheduleType"]',
        );
        const commandSelect = document.querySelector(
          'sdpi-select[setting="command"]',
        );
        const { localTimeFields, timeText, toLocalSchedule } =
          window.GoveeScheduleTime;

        // Last known repeat type and action; the selects report no value
        // until their options render, so they can't be read on demand.
        const shown = { type: "daily", command: "on" };

        function showFor(type = shown.type, command = shown.command) {
          shown.type = type;
          shown.command = command;
          const repeating = type !== "delay";
          timeItem.classList.toggle("hidden", !repeating);
          daysItem.classList.toggle("hidden", type !== "weekly");
          delayItem.classList.toggle("hidden", type !== "delay");
          brightnessItem.classList.toggle("hidden", command !== "brightness");
        }

        async function load(client) {
          const { settings = {} } = (await client.getSettings()) || {};
          const patch = {};
          if (!settings.scheduleId) {
            patch.scheduleId = `schedule-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
          }
          // Keys saved before 3.0.1 hold UTC times: convert them once.
          const local = toLocalSchedule(settings);
          if (local) Object.assign(patch, local);
          if (Object.keys(patch).length)
            await window.GoveePI.patchSettings(patch);
          const current = { ...settings, ...patch };
          timeInput.value = timeText(current.hour, current.minute);
          dayList.value = (current.days || []).map(String);
          delayInput.value =
            current.delaySeconds === undefined
              ? ""
              : String(current.delaySeconds);
          showFor(current.scheduleType || "daily", current.command);
        }

        window.GoveePI.ready((client) => {
          load(client);

          timeInput.addEventListener("valuechange", () => {
            const fields = localTimeFields(timeInput.value);
            if (fields) window.GoveePI.patchSettings(fields);
          });
          dayList.addEventListener("valuechange", () => {
            window.GoveePI.patchSettings({
              days: (dayList.value || []).map(Number).sort(),
              clock: "local",
            });
          });
          delayInput.addEventListener("valuechange", () => {
            const seconds = parseInt(delayInput.value, 10);
            if (Number.isInteger(seconds) && seconds > 0)
              window.GoveePI.patchSettings({ delaySeconds: seconds });
          });
          typeSelect.addEventListener("valuechange", () => {
            if (typeSelect.value) showFor(typeSelect.value, undefined);
          });
          commandSelect.addEventListener("valuechange", () => {
            if (commandSelect.value) showFor(undefined, commandSelect.value);
          });
        });
      });
    </script>
  </body>
</html>
