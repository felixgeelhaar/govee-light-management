name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build, Pack & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # attest-build-provenance needs both of these: `attestations: write` to
      # record the attestation against this repository, and the OIDC token to
      # mint the short-lived certificate it signs with. With only
      # `contents: write` the attest step fails rather than quietly producing
      # an unattested release.
      attestations: write
      id-token: write # nox:ignore IAC-306 -- OIDC is the keyless-signing mechanism for the attestation; removing it ships the download unsigned

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Validate plugin
        run: npx streamdeck validate com.felixgeelhaar.govee-light-management.sdPlugin

      - name: Pack plugin
        run: npx streamdeck pack com.felixgeelhaar.govee-light-management.sdPlugin --force

      # Everything below runs on the packed file, before it is uploaded, so
      # the checksum and the attestation describe the exact bytes released.
      - name: Checksum the packed plugin
        run: sha256sum com.felixgeelhaar.govee-light-management.streamDeckPlugin | tee checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: com.felixgeelhaar.govee-light-management.streamDeckPlugin

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          {
            echo "## What's New in v${{ steps.version.outputs.VERSION }}"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              # Include every conventional-commit type so chore-only releases
              # (e.g. dep bumps, release bumps) and docs updates still show up.
              # Previously the filter only matched feat/fix/perf/refactor,
              # leaving v2.3.1's "What's New" empty after a dep bump.
              git log ${PREV_TAG}..HEAD --pretty=format:"- %s" \
                --grep="^feat" \
                --grep="^fix" \
                --grep="^perf" \
                --grep="^refactor" \
                --grep="^chore" \
                --grep="^docs" \
                --grep="^build" \
                --grep="^ci" \
                --grep="^test" \
                --grep="^style" \
                --grep="^revert"
              echo ""
            fi
            echo ""
            echo "## Installation"
            echo ""
            echo "1. Download \`com.felixgeelhaar.govee-light-management.streamDeckPlugin\` below"
            echo "2. Double-click to install in Stream Deck"
            echo ""
            echo "## Verifying your download"
            echo ""
            echo "Installing from this page bypasses the Marketplace's review, so the"
            echo "download is attested: GitHub signs a statement that this exact file was"
            echo "built by this repository's release workflow. To check it before installing:"
            echo ""
            echo '```bash'
            echo "gh attestation verify com.felixgeelhaar.govee-light-management.streamDeckPlugin --repo felixgeelhaar/govee-light-management"
            echo '```'
            echo ""
            echo "A mismatch means the file is not what this workflow produced — do not install it."
            echo ""
            echo "\`checksums.txt\` below carries the same file's SHA-256, for checking a"
            echo "download against a second copy without the GitHub CLI:"
            echo ""
            echo '```bash'
            echo "shasum -a 256 -c checksums.txt"
            echo '```'
            echo ""
            echo "## Requirements"
            echo ""
            echo "- Stream Deck software 6.9 or later"
            echo "- macOS 12+ or Windows 10+"
            echo "- Govee API key from [developer.govee.com](https://developer.govee.com)"
          } > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          body_path: release_notes.md
          files: |
            com.felixgeelhaar.govee-light-management.streamDeckPlugin
            checksums.txt
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
