# Keeps dependencies current, as opposed to merely un-vulnerable.
#
# nox-remediate.yml upgrades packages with a known advisory. Nothing was
# watching the rest, so the tree drifted: by 2026-09 eslint was 5 minors
# behind, @elgato/cli two minors, and typescript-eslint eight — none of it
# a vulnerability, all of it work that piles up until a major forces it.
#
# This runs the in-range upgrade (`npm update`, lockfile only), proves it
# against the repo's own gates, and opens one PR. Majors are reported, never
# applied: taking one is a judgement call, and for this plugin it is usually
# a judgement about Node. vitest 5 and jsdom 30 both require Node >= 22 while
# the plugin's manifest pins its runtime to Node 20, so the PR body names the
# engine that holds each one back rather than leaving a maintainer to
# rediscover it.
name: Dependency Freshness

on:
  schedule:
    - cron: "41 6 * * 1" # Mondays 06:41 UTC, after nox-remediate at 06:17
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deps-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR opened with the default GITHUB_TOKEN gets no CI run — the
          # push it makes cannot trigger workflows — so it sits unmergeable
          # behind required checks until a human pushes an empty commit.
          # NOX_TOKEN is the PAT this repo already uses for that reason.
          token: ${{ secrets.NOX_TOKEN || github.token }}
          persist-credentials: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          # The runtime Stream Deck gives the plugin, per manifest Nodejs.Version.
          # Resolving updates on a newer Node would happily install packages
          # this plugin cannot run.
          node-version: "20"
          cache: "npm"

      - name: Install from the committed lockfile
        run: npm ci

      - name: Apply in-range updates
        run: |
          npm update
          if git diff --quiet -- package.json package-lock.json; then
            echo "fresh=false" >> "$GITHUB_ENV"
            echo "Every dependency is already at its newest in-range version."
          else
            echo "fresh=true" >> "$GITHUB_ENV"
          fi

      - name: Summarise what moved
        if: env.fresh == 'true'
        run: |
          # shellcheck disable=SC2016  # the node script below is single-quoted on purpose
          {
            echo "### In-range updates"
            echo
            echo "| Package | From | To |"
            echo "|---|---|---|"
            node -e '
              const { execSync } = require("child_process");
              const before = JSON.parse(execSync("git show HEAD:package-lock.json").toString());
              const after = require("./package-lock.json");
              const rows = [];
              for (const [path, pkg] of Object.entries(after.packages)) {
                if (!path.startsWith("node_modules/")) continue;
                const was = before.packages[path];
                if (was && was.version !== pkg.version) {
                  rows.push([path.replace(/^node_modules\//, ""), was.version, pkg.version]);
                }
              }
              rows.sort((a, b) => a[0].localeCompare(b[0]));
              for (const [name, from, to] of rows) console.log(`| \`${name}\` | ${from} | ${to} |`);
              if (!rows.length) console.log("| _(no resolved version changed)_ | | |");
            '
          } > /tmp/updates.md
          cat /tmp/updates.md

      # Records the outcome and exits 0 deliberately: the PR step below must
      # still run, so a broken update lands on a branch with the failure named
      # in the body rather than vanishing. The job is failed at the end
      # instead, which keeps the red Monday signal without suppressing a step.
      - name: Prove the updates against the repo's own gates
        if: env.fresh == 'true'
        id: verify
        run: |
          set -o pipefail
          fail=""
          for script in type-check lint format:check test build; do
            echo "::group::npm run $script"
            if npm run --silent "$script"; then
              echo "  ok: $script"
            else
              echo "  FAILED: $script"
              fail="$fail $script"
            fi
            echo "::endgroup::"
          done
          if [ -n "$fail" ]; then
            echo "verified=false" >> "$GITHUB_ENV"
            echo "failed_scripts=$fail" >> "$GITHUB_ENV"
          else
            echo "verified=true" >> "$GITHUB_ENV"
          fi

      - name: Report the majors being held, and why
        if: env.fresh == 'true'
        run: |
          # `npm outdated` exits 1 when anything is outdated; that is the
          # normal case here, not an error.
          npm outdated --json > /tmp/outdated.json || true
          # shellcheck disable=SC2016  # single-quoted on purpose: this is a node script
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            let outdated = {};
            try { outdated = JSON.parse(fs.readFileSync("/tmp/outdated.json", "utf8") || "{}"); } catch {}
            const names = Object.keys(outdated).filter(
              (n) => outdated[n].wanted !== outdated[n].latest
            );
            if (!names.length) {
              fs.writeFileSync("/tmp/majors.md", "");
              process.exit(0);
            }
            const lines = [
              "### Majors held back",
              "",
              "Not applied — taking one is a judgement call. Node requirement shown where it is the reason.",
              "",
              "| Package | Current | Latest | Requires Node |",
              "|---|---|---|---|",
            ];
            for (const name of names) {
              const { current, latest } = outdated[name];
              let engines = "";
              try {
                engines = execSync(
                  `npm view ${name}@${latest} engines.node --silent`,
                  { encoding: "utf8" }
                ).trim();
              } catch {}
              lines.push(
                `| \`${name}\` | ${current} | ${latest} | ${engines || "—"} |`
              );
            }
            lines.push("");
            lines.push(
              "This plugin runs on Node 20 (`manifest.json` → `Nodejs.Version`), so a major requiring Node 22+ needs CI, `engines` and that manifest moved together before it can land."
            );
            fs.writeFileSync("/tmp/majors.md", lines.join("\n"));
          '
          cat /tmp/majors.md || true

      - name: Open or update the freshness PR
        if: env.fresh == 'true'
        env:
          GH_TOKEN: ${{ secrets.NOX_TOKEN || github.token }}
          NOX_TOKEN_PRESENT: ${{ secrets.NOX_TOKEN != '' && 'yes' || '' }}
        run: |
          branch="deps/freshness"
          git config user.name "deps-freshness"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch" 2>/dev/null || git switch "$branch"
          git commit -am "chore(deps): in-range dependency updates"

          # Force-push is correct for this branch and only this branch: it is
          # owned by this workflow, re-created from main each run, and holds
          # nothing a human authored.
          git push --force -u origin "$branch"

          if [ "$verified" = "true" ]; then
            headline="All gates pass on the updated tree: type-check, lint, format:check, the test suite, and build."
          else
            headline="⚠️ **Verification failed on:**$failed_scripts — do not merge until that is understood. The branch is pushed so the failure is reproducible."
          fi

          body="$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "$headline" \
            "$(cat /tmp/updates.md)" \
            "$(cat /tmp/majors.md 2>/dev/null)" \
            "Opened by \`.github/workflows/deps-freshness.yml\`. nox-remediate covers advisories; this covers everything else.")"

          if existing="$(gh pr view "$branch" --json url --jq .url 2>/dev/null)" && [ -n "$existing" ]; then
            gh pr edit "$branch" --title "chore(deps): in-range dependency updates" --body "$body"
            echo "Updated $existing"
            exit 0
          fi

          if ! url="$(gh pr create --title "chore(deps): in-range dependency updates" --body "$body" 2>&1)"; then
            echo "::error::Updates are pushed to '$branch' but the PR could not be opened."
            echo "  gh said: $url"
            if [ -z "$NOX_TOKEN_PRESENT" ]; then
              echo "  NOX_TOKEN is not set. The default GITHUB_TOKEN can only open PRs when"
              echo "  'Allow GitHub Actions to create and approve pull requests' is enabled,"
              echo "  and a PR it opens gets no CI run."
            fi
            exit 1
          fi
          echo "Opened $url"

          # Auto-merge only a run that proved itself. CI still gates the merge;
          # this just removes the second trip for the ordinary green case.
          if [ "$verified" = "true" ]; then
            gh pr merge "$branch" --squash --auto \
              --subject "chore(deps): in-range dependency updates" || \
              echo "::warning::Auto-merge could not be enabled; merge manually once CI is green."
          fi

      # The red signal, after the PR exists. A gate that broke under the new
      # versions is the one thing here worth waking someone on a Monday.
      - name: Fail the run when a gate broke
        if: env.fresh == 'true' && env.verified != 'true'
        run: |
          echo "::error::Dependency update broke:$failed_scripts — see the PR on branch deps/freshness."
          exit 1
