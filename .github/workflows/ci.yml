name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "LICENSE"
      - ".gitignore"
  # No paths-ignore on pull requests: branch protection requires these checks,
  # so a docs-only PR that skipped CI could never merge.
  pull_request:
    branches: [main, develop]

# Cancel outdated runs for same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quick validation on the single Node version Stream Deck runs plugins on.
  # Elgato's CLI validator currently pins the runtime to Node 20 (manifest
  # Nodejs.Version); Node 24 is documented but not yet accepted by the packer.
  # We track the validator-supported version and test only that — other
  # versions add no signal for a plugin that always runs on Elgato's runtime.
  test:
    name: Test (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm" # ✅ Cache npm dependencies

      - name: Install dependencies
        run: npm ci # ✅ Faster than npm install, uses package-lock.json

      - name: Run linting
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: SDK settings protocol regression
        run: npm run test:sdk-protocol

      - name: Run build
        run: npm run build

  # Forward-compatibility signal, not a gate. Node 20 is end-of-life
  # (2026-04-30) but the manifest cannot select 24 until Elgato's schema and
  # validator accept it; Stream Deck already bundles 24. This job shows
  # whether tests and the bundle survive the move, without blocking merges.
  test-node-24:
    name: Test (Node 24, forward-compat)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build

  # Cross-platform testing (only for PRs to main or on main branch)
  test-cross-platform:
    name: Cross-Platform Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'pull_request' && github.base_ref == 'main' || github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: SDK settings protocol regression
        run: npm run test:sdk-protocol

      - name: Run build
        run: npm run build

  # E2E tests only on Linux (web apps are cross-platform)
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Build plugin
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 # nox:ignore IAC-153 -- failure-only Playwright report, read by maintainers and expiring in 7 days; nobody installs it. The file users install is the packed plugin, which release.yml now attests.
        if: failure() # ✅ Only upload on failure to save quota
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7 # ✅ Reduced from 30 to save storage

  # Security audit (lightweight, runs on Linux only)
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level high
        continue-on-error: true # ✅ Don't fail CI on audit warnings

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript
          config-file: ./.github/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript"
          upload: true
        continue-on-error: true

  # Code quality with coverage (runs once, not per matrix)
  quality:
    name: Code Quality & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run coverctl coverage check
        run: npx coverctl check --fail-under 80 || true
        continue-on-error: true

  # nox runs from the fleet's shared workflow, so every repository scans with
  # the same pinned version. It enforces: this repo's reviewed baseline lives at
  # .nox-baseline.json (policy.baseline_path in .nox.yaml), not .nox/, so the
  # gate is told to fail on unbaselined critical/high rather than wait for one.
  nox:
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    uses: klarlabs-studio/.github/.github/workflows/nox.yml@main
    with:
      nox-strict: true
